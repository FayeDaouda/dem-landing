<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEM — Informations légales</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9fafb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 900;
      color: #1a1a2e;
      letter-spacing: -1px;
      margin-bottom: 0.3rem;
    }
    .tagline {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 3rem;
    }
    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem 2.5rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 200px;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.15);
    }
    .card .icon { font-size: 2.2rem; margin-bottom: 0.8rem; }
    .card h2 { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .card p  { font-size: 0.82rem; color: #6b7280; margin-top: 0.3rem; }
    footer {
      margin-top: 3rem;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="logo">DEM</div>
  <div class="tagline">Delivery Express Mobility</div>

  <div class="cards">
    <a class="card" href="privacy.html">
      <div class="icon">🔒</div>
      <h2>Politique de confidentialité</h2>
      <p>Comment nous utilisons et protégeons vos données</p>
    </a>
    <a class="card" href="terms.html">
      <div class="icon">📄</div>
      <h2>Conditions d'utilisation</h2>
      <p>Règles et responsabilités des utilisateurs</p>
    </a>
  </div>

  <footer>&copy; 2026 DEM — Dakar, Sénégal</footer>
</body>
</html>
